# LiviMuse stack for Dockge. Fill in the tokens (or move them to a .env file).
services:
  livimuse:
    image: ghcr.io/adl101010/livimuse:latest
    container_name: livimuse
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - DISCORD_TOKEN=
      - YOUTUBE_API_KEY=
      - SPOTIFY_CLIENT_ID=
      - SPOTIFY_CLIENT_SECRET=
      # Updates yt-dlp (the YouTube downloader) on every start, since YouTube
      # breaks more often than Muse releases.
      - YT_DLP_AUTO_UPDATE=true
      # Optional now-playing card settings (defaults shown):
      # - LIVIMUSE_CARD_REFRESH_SECONDS=5     # how often the time updates (minimum 2)
      # - LIVIMUSE_REPOST_AFTER_MESSAGES=3    # messages below the card before it reposts (0 = never)
      # - LIVIMUSE_REPOST_QUIET_SECONDS=5     # how long chat must be quiet before reposting
      # - LIVIMUSE_UP_NEXT_COUNT=3            # songs under "Up next" (0 = hide, max 10)
      # - LIVIMUSE_YT_DLP_UPDATE_HOURS=24     # re-check yt-dlp while running (0 = startup only)
